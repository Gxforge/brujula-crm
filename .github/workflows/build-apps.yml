name: Build Android APK & Windows PC App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK y licencias
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Instalar dependencias y preparar web
        run: |
          npm install --no-audit --no-fund
          npm run prepare:web
          npm run test:pc-smoke
          npx --yes esbuild src/main.js --bundle --format=esm --outfile=/tmp/brujula-smoke.js

      - name: Generar proyecto Android con Capacitor
        run: |
          npx cap add android
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r assets/android-res/* android/app/src/main/res/

      - name: Compilar y firmar APK Release (v1 + v2)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias brujula \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass brujula2026 \
            -keypass brujula2026 \
            -dname "CN=Brujula CRM, OU=Gxforge, O=Gxforge, L=Havana, S=Havana, C=CU"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          mkdir -p ../release-out
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias brujula \
            --ks-pass pass:brujula2026 \
            --key-pass pass:brujula2026 \
            --out ../release-out/Brujula-CRM-Android.apk \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose ../release-out/Brujula-CRM-Android.apk

      - name: Subir artefacto APK Android
        uses: actions/upload-artifact@v4
        with:
          name: Brujula-CRM-Android-APK
          path: release-out/Brujula-CRM-Android.apk
          if-no-files-found: error

  build-pc:
    name: Compilar Ejecutables PC (Windows)
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y compilar .exe
        run: |
          npm install --no-audit --no-fund
          npm run test:pc-smoke
          npm run build:pc

      - name: Subir artefactos PC Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Brujula-CRM-Windows-PC
          path: |
            dist-pc/Brujula-CRM-PC-Portable.exe
            dist-pc/Brujula-CRM-PC-Setup.exe
          if-no-files-found: error

  publish-release:
    name: Publicar Release con APK y EXE
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-pc]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Reunir binarios finales
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.apk" -o -name "*.exe" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Publicar en GitHub Releases (etiqueta actual)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Brújula CRM ${{ github.ref_name }} · Edición estable · Flutter nativo · Sincronización con cuenta"
          body: |
            ### Instaladores compilados automáticamente por GitHub Actions
            - **Corrección Android:** arreglado error de sintaxis que impedía inicializar los botones; corregido panel de sincronización.
            - **Interfaz:** iconos vectoriales propios; resumen financiero claro y diseño adaptable a móvil y PC.
            - **Edición:** los campos mantienen el foco al actualizarse los datos; los paneles no reemplazan formularios activos.
            - **Ajustes:** sincronización simplificada; se quitaron la sección de formulario público y demos técnicas.
            - **Validación CI:** smoke test funcional de navegación, alta y persistencia; esbuild empaqueta el módulo principal.
            - **Android (Teléfono / Tablet):** Descarga e instala `Brujula-CRM-Android.apk`.
            - **PC Windows (Portable sin instalación):** Abre directamente `Brujula-CRM-PC-Portable.exe`.
            - **PC Windows (Instalador completo):** Ejecuta `Brujula-CRM-PC-Setup.exe` para crear accesos directos en Escritorio e Inicio.
            ### Novedades v1.2.0 — Bloque Producción M01-M06
            - Tablero Kanban de Producción (Faltan insumos → En diseño → Revisión → Publicado) con promoción automática al aprobar.
            - Checklist de Insumos del cliente con % de avance.
            - Cotizaciones en 3 niveles (Básico/Pro/Completo) con envío directo a WhatsApp.
            - Control de revisiones incluidas vs usadas, bóveda técnica con QR y cronómetro de rentabilidad por hora.
          files: release-files/*
          prerelease: false
          make_latest: true
